name: Train ML Model

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preprocess data
        run: python src/data_preprocessing.py

      - name: Train model
        run: python src/model.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results
          path: |
            reports/best_model_actual_vs_predicted.png
            artifacts/metrics/training_history.json
